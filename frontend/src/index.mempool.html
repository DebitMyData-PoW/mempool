  <script>
    /* Light or dark: the visitor's choice (this site's own cookie), else dark. */
    (function () {
      var t = null;
      try {
        var m = document.cookie.match(/(?:^|;\s*)dmd-theme-explorer=(light|dark)/);
        t = m ? m[1] : localStorage.getItem('dmd-theme-explorer');
      } catch (e) {}
      if (t !== 'light' && t !== 'dark') { t = 'dark'; }
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
    })();
  </script>
